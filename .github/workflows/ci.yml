name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Studio and gateway regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            work/yingliu-studio/requirements.txt
            work/research-jimeng2api/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r work/research-jimeng2api/requirements-dev.txt
      - name: Check canvas node copying
        run: node work/check_canvas_copy.cjs
      - name: Check Studio video resolutions
        run: python work/check_video_resolutions.py
      - name: Check Jimeng gateway video resolutions
        working-directory: work/research-jimeng2api
        run: python -m pytest tests/test_video_resolutions.py

  docker:
    name: Docker build and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: xuebao-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start Studio
        run: docker compose up --build --wait --wait-timeout 180
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and test data
        if: always()
        run: docker compose down --volumes
