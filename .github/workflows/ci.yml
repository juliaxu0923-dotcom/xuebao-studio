name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Studio and gateway regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            work/yingliu-studio/requirements.txt
            work/research-jimeng2api/requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r work/research-jimeng2api/requirements-dev.txt
      - name: Check canvas node copying
        run: node work/check_canvas_copy.cjs
      - name: Check Studio image and video parameters
        run: |
          python work/check_image_sizes.py
          python work/check_video_resolutions.py
      - name: Check Studio generation history
        run: python work/check_generation_history.py
      - name: Check Studio resource limits
        run: |
          python work/check_studio_resources.py
          python work/check_media_proxy.py
      - name: Check Jimeng gateway video parameters
        working-directory: work/research-jimeng2api
        run: python -m pytest tests/test_video_resolutions.py tests/test_video.py tests/test_video_duration_failure.py tests/test_video_entitlement.py
      - name: Check Jimeng QR login readiness
        working-directory: work/research-jimeng2api
        run: python -m pytest tests/test_login_assistant.py

  docker:
    name: Docker build and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: xuebao-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start Studio
        run: docker compose up --build --wait --wait-timeout 180
      - name: Report Studio image size
        run: docker image inspect xuebao-studio:local --format '{{.Size}} bytes'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and test data
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish Docker image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build registry image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:latest" .
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
