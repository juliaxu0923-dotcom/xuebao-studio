[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/xuebao-supervisord.pid
childlogdir=/tmp

[program:canvas]
command=/usr/local/bin/node server.js
directory=/app/work/infinite-inspect/resources/app/web
environment=PORT="8001",HOSTNAME="127.0.0.1"
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8300
directory=/app/work/research-jimeng2api
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:studio]
command=/usr/local/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app/work/yingliu-studio
priority=30
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
