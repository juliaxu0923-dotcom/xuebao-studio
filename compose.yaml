services:
  studio:
    build: .
    image: xuebao-studio:local
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    shm_size: 512mb
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8000}:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      JIMENG2API_HTTP_PROXY: ${JIMENG2API_HTTP_PROXY:-}
    volumes:
      - studio-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  studio-data:
